# Builds and verifies every pull request and every push to main. The jobs
# below are required status checks on main: nothing merges unless all pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: Tools/ci/check-headers.sh

  test:
    # The reader and writer tests use the first .mpp in Fixtures/ and skip
    # without one, so the suite runs once per shipped sample.
    name: Test (${{ matrix.os }}, ${{ matrix.fixture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
        fixture: [MPPKit-Feature-Sample, Blank-Template, MPPKit-Diagnostic]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Fixture
        run: mkdir -p Fixtures && cp "Samples/${{ matrix.fixture }}.mpp" Fixtures/
      - name: Project-saved corpus
        # MPXJ's Project 2010/2013 test files, at a pinned commit: the only
        # files in CI that Project itself wrote. ConformanceTests holds them,
        # and what the writer produces, to the rules Project's files keep.
        run: Tools/ci/fetch-corpus.sh Corpus
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        # Two tests need a real file saved by Microsoft Project, which cannot
        # be published: the schedule check compares against the dates Project
        # computed (the samples were written by MPPKit), and the leak check
        # treats the template's text as private (the samples are already
        # neutralised, so it finds the neutraliser's own placeholders). Run
        # them locally with such a file in Fixtures/.
        run: >-
          swift test --skip-build --parallel
          --skip SchedulingTests.testScheduleMatchesProjectOnSavedFiles
          --skip MPP14WriterTests.testWrittenFileCarriesNoTemplateData

  ipados:
    name: Build for iPadOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build MPPKit for iOS
        run: |
          set -o pipefail
          xcodebuild build -scheme MPPKit -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tail -n 40

  oracle:
    # An independent reader agreeing with MPPKit, field for field, on the
    # shipped samples, on files the writer produces in this run and on files
    # Microsoft Project saved.
    name: MPXJ oracle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Tools/mpxj-oracle/requirements.txt
      - name: MPXJ environment
        run: |
          python -m venv Tools/mpxj-oracle/.venv
          Tools/mpxj-oracle/.venv/bin/pip install -q -r Tools/mpxj-oracle/requirements.txt
          echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
      - name: Build mppdump
        run: swift build -c release --product mppdump
      - name: Write fresh files
        run: |
          mkdir -p out
          dump=$(swift build -c release --show-bin-path)/mppdump
          "$dump" sample Samples/Blank-Template.mpp out/sample.mpp
          "$dump" template Samples/MPPKit-Feature-Sample.mpp out/blank.mpp
          "$dump" synthfile Samples/Blank-Template.mpp out/synth-500.mpp 500
      - name: Compare with MPXJ
        run: Tools/ci/oracle-check.sh Samples/*.mpp out/*.mpp
      - name: Project-saved corpus
        run: Tools/ci/fetch-corpus.sh Corpus
      - name: Rules Project's files keep
        # Meta bits that say a field has a value exactly when it has one, on
        # the corpus, the samples and the files written above.
        run: |
          "$(swift build -c release --show-bin-path)/mppdump" check Corpus/*.mpp Samples/*.mpp out/*.mpp
      - name: Compare with MPXJ on Project-saved files
        # Fails on a difference not in Tools/ci/corpus-known-differences.txt.
        run: Tools/ci/corpus-oracle.sh Corpus/*.mpp
      - name: Keep written files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: written-files
          path: out/

  ci-ok:
    # One stable check name for the branch rules, whatever the matrix becomes.
    name: CI passed
    if: always()
    needs: [headers, test, ipados, oracle]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all checks passed"
