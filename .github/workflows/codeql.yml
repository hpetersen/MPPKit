name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-26
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
