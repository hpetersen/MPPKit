# Push a version tag (e.g. 0.2.0) on main: CI runs in full on the tagged
# commit and, when it passes, a GitHub release is published with generated
# notes. Swift Package Manager resolves versions straight from the tags.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          samples="Samples/MPPKit-Feature-Sample.mpp Samples/Blank-Template.mpp"
          # A release made by hand with `gh release create` already exists:
          # attach the samples to it instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $samples
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "MPPKit $TAG" $prerelease $samples
          fi
